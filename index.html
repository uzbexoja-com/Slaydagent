<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.4 -apple-system,"SF Pro Display",Inter,"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg1);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(90deg,transparent calc(var(--lx) - 1px),var(--ml) calc(var(--lx) - 1px),var(--ml) calc(var(--lx) + 1px),transparent calc(var(--lx) + 1px)),linear-gradient(var(--gl) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--gl) 1px,transparent 1px) 0 0/24px 24px,radial-gradient(60% 40% at 8% 0%,var(--g1),transparent 70%),radial-gradient(55% 35% at 100% 45%,var(--g2),transparent 70%),linear-gradient(180deg,var(--bg0),var(--bg1))}
.o1,.o2{position:absolute;border-radius:50%;will-change:transform;animation:fl 24s ease-in-out infinite alternate}

#app,#ov{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 130px 36px}

h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:23px;line-height:1.2}h2{font-size:18px}

.g.list{padding:2px 16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;transition:transform .12s}button:active{transform:scale(.96)}

textarea{border-radius:22px;resize:none}input:focus,textarea:focus{outline:0;border-color:var(--hl)}

.sw.on{background:var(--pb)}.sw.on i{transform:translateX(20px);background:#fff}

.hd{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border-radius:50%;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center;box-shadow:inset 0 1px 1px var(--hl)}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;box-shadow:0 8px 16px -12px var(--sh),inset 0 1px 1px var(--hl);background:var(--card);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--pb);color:#fff;border-color:transparent}
.paper{background:#fff;color:#111;border-radius:6px;padding:18px 12px;text-align:center;font:11px/1.5 Georgia,serif;border:1px solid #ddd;box-shadow:0 8px 20px -8px rgba(0,0,0,.3)}
.box{background:var(--chip);border-radius:999px;padding:12px 18px;font:13px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gen{text-align:center;padding:90px 10px}.gi{font-size:54px}
.fb,nav,.tour{background:var(--bar);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--line);box-shadow:0 18px 36px -18px var(--sh),inset 0 1px 1px var(--hl),inset 0 -2px 3px var(--bev)}

.an>*{animation:up .4s cubic-bezier(.2,.8,.2,1) both}.an>*:nth-child(2){animation-delay:.04s}.an>*:nth-child(3){animation-delay:.08s}.an>*:nth-child(n+4){animation-delay:.12s}

.scr>.g{flex:0 0 148px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
